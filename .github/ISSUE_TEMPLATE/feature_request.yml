name: Improvement
description: Suggest a new claim pattern, adapter, importer, or docs change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What does the checker miss or get wrong today? An example reply and log help.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Link docs if it involves another framework or log format.
