name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  langchain:
    name: tests with langchain-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install langchain-core
      - run: python -m unittest tests.test_langchain -v

  action:
    name: GitHub Action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clean run passes
        uses: ./
        with:
          message: examples/ci/runs/refund-ok/reply.txt
          log: examples/ci/runs/refund-ok/tool_log.json

      - name: Runs folder, report only
        id: report
        uses: ./
        with:
          runs: examples/ci/runs
          fail-on: never
          json-report: saydo-report.json

      - name: Check outputs
        run: |
          test "${{ steps.report.outputs.claims }}" = "5"
          test "${{ steps.report.outputs.gaps }}" = "3"
          test "${{ steps.report.outputs.stop-ship }}" = "true"
          test "${{ steps.report.outputs.failed-runs }}" = "1"
          python3 -c "import json; assert len(json.load(open('saydo-report.json'))['runs']) == 2"

      - name: Unsupported claim fails the step
        id: gate
        continue-on-error: true
        uses: ./
        with:
          message: examples/ci/runs/refund-timeout/reply.txt
          log: examples/ci/runs/refund-timeout/tool_log.json

      - name: Expect the previous step to have failed
        run: test "${{ steps.gate.outcome }}" = "failure"

      - name: planlock log through the Action
        id: planlock
        uses: ./
        with:
          message: examples/planlock/reply.txt
          log: examples/planlock/session_events.log
          from: planlock
          map: examples/planlock/tool_map.json
          fail-on: never

      - name: AGT audit log through the Action
        id: agt
        uses: ./
        with:
          message: examples/agt/reply.txt
          log: examples/agt/maf_audit.jsonl
          from: auto
          fail-on: never

      - name: Check importer outputs
        run: |
          test "${{ steps.planlock.outputs.claims }}" = "4"
          test "${{ steps.planlock.outputs.gaps }}" = "2"
          test "${{ steps.planlock.outputs.stop-ship }}" = "false"
          test "${{ steps.agt.outputs.claims }}" = "5"
          test "${{ steps.agt.outputs.gaps }}" = "3"
          test "${{ steps.agt.outputs.stop-ship }}" = "true"

  importers:
    name: AGT fixtures re-verified with the real toolkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "agent-governance-toolkit-core==5.0.0"
      - run: python -W ignore tests/agt_crosscheck.py
