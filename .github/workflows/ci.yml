name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  langchain:
    name: tests with langchain-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install langchain-core
      - run: python -m unittest tests.test_langchain -v

  action:
    name: GitHub Action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean run passes
        uses: ./
        with:
          message: examples/ci/runs/refund-ok/reply.txt
          log: examples/ci/runs/refund-ok/tool_log.json

      - name: Runs folder, report only
        id: report
        uses: ./
        with:
          runs: examples/ci/runs
          fail-on: never
          json-report: saydo-report.json

      - name: Check outputs
        run: |
          test "${{ steps.report.outputs.claims }}" = "5"
          test "${{ steps.report.outputs.gaps }}" = "3"
          test "${{ steps.report.outputs.stop-ship }}" = "true"
          test "${{ steps.report.outputs.failed-runs }}" = "1"
          python3 -c "import json; assert len(json.load(open('saydo-report.json'))['runs']) == 2"

      - name: Unsupported claim fails the step
        id: gate
        continue-on-error: true
        uses: ./
        with:
          message: examples/ci/runs/refund-timeout/reply.txt
          log: examples/ci/runs/refund-timeout/tool_log.json

      - name: Expect the previous step to have failed
        run: test "${{ steps.gate.outcome }}" = "failure"
