[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "saydo-diff"
version = "0.3.0"
description = "Flag AI agent claims that the tool-call log does not support."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
saydo-diff = "saydo_diff.__main__:main"

[tool.setuptools]
packages = ["saydo_diff", "saydo_diff.adapters"]
